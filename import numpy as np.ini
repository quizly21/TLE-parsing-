import numpy as np
import requests
from bs4 import BeautifulSoup

def solve_kepler_equation(M, e, iterations=50, tolerance=1e-12):
    """Численное решение уравнения Кеплера с повышенной точностью"""
    if e < 0 or e >= 1:
        raise ValueError("Эксцентриситет должен быть 0 ≤ e < 1")
    
    E = M  # Начальное приближение
    for _ in range(iterations):
        delta = E - e * np.sin(E) - M
        if abs(delta) < tolerance:
            break
        E -= delta / (1 - e * np.cos(E))
    return E

def parse_tle(tle_text):
    """Корректный парсинг TLE данных"""
    lines = [line.strip() for line in tle_text.split('\n') if len(line.strip()) >= 65]
    if len(lines) < 2:
        raise ValueError("Недостаточно строк в TLE (нужно 2 строки)")
    return lines[0], lines[1]

def tle_to_orbital_elements(tle_line1, tle_line2):
    """Расчет всех орбитальных параметров из TLE"""
    
        # Проверка формата TLE
        if len(tle_line1) < 69 or len(tle_line2) < 69:
            raise ValueError("Строки TLE должны содержать минимум 69 символов")

        # Извлечение всех параметров
        inclination = np.clip(float(tle_line2[8:16]), 0, 180)  # Наклонение (i) в градусах
        raan = float(tle_line2[17:25]) % 360  # Прямое восхождение восходящего узла (Ω) в градусах
        eccentricity = min(float("0." + tle_line2[26:33].lstrip('0')), 0.9999)  # Эксцентриситет (e)
        arg_periapsis = float(tle_line2[34:42]) % 360  # Аргумент перигея (ω) в градусах
        mean_anomaly = float(tle_line2[43:51]) % 360  # Средняя аномалия (M) в градусах
        mean_motion = max(float(tle_line2[52:63]), 0.01)  # Среднее движение (оборотов в день)
        
        # Конвертация в радианы для расчетов
        M_rad = np.radians(mean_anomaly)
        omega_rad = np.radians(arg_periapsis)
        raan_rad = np.radians(raan)
        inc_rad = np.radians(inclination)

        # Решение уравнения Кеплера
        E = solve_kepler_equation(M_rad, eccentricity)

        # Расчет истинной аномалии (ν)
        true_anomaly = 2 * np.arctan2(
            np.sqrt(1 + eccentricity) * np.sin(E/2),
            np.sqrt(1 - eccentricity) * np.cos(E/2)
        )
        true_anomaly_deg = np.degrees(true_anomaly) % 360

        # Аргумент широты (u)
        argument_of_latitude = (arg_periapsis + true_anomaly_deg) % 360

        # Расчет орбитальных параметров
        n_rad_per_sec = mean_motion * 2 * np.pi / 86400  # rad/sec
        a = (398600.4418 / n_rad_per_sec**2)**(1/3)  # Большая полуось в км
        r = a * (1 - eccentricity**2) / (1 + eccentricity * np.cos(true_anomaly))

        # Преобразование в ECI координаты
        x = r * (np.cos(raan_rad) * np.cos(omega_rad + true_anomaly) - 
             np.sin(raan_rad) * np.sin(omega_rad + true_anomaly) * np.cos(inc_rad))
        y = r * (np.sin(raan_rad) * np.cos(omega_rad + true_anomaly) + 
             np.cos(raan_rad) * np.sin(omega_rad + true_anomaly) * np.cos(inc_rad))
        z = r * np.sin(omega_rad + true_anomaly) * np.sin(inc_rad)

        return {
            'inclination_deg': round(inclination, 6),
            'raan_deg': round(raan, 6),
            'eccentricity': round(eccentricity, 8),
            'arg_periapsis_deg': round(arg_periapsis, 6),
            'mean_anomaly_deg': round(mean_anomaly, 6),
            'true_anomaly_deg': round(true_anomaly_deg, 6),
            'mean_motion': round(mean_motion, 8),
            'argument_of_latitude': round(argument_of_latitude, 6),
            'eci_position_km': (round(x, 3), round(y, 3), round(z, 3)),
            'altitude_km': round(a - 6378.137, 3),
            'semimajor_axis_km': round(a, 3)
        }

    except Exception as e:
        raise ValueError(f"Ошибка обработки TLE: {str(e)}")

def main():
    try:
        # Загрузка TLE для МКС (NORAD ID 25544)
        print("Загружаем актуальные TLE данные...")
        url = "https://celestrak.org/NORAD/elements/gp.php?CATNR=61777"
        response = requests.get(url, timeout=15)
        response.raise_for_status()
        
        tle_text = BeautifulSoup(response.text, 'html.parser').get_text()
        line1, line2 = parse_tle(tle_text)
        
        print("\nАнализ TLE данных:")
        print(f"Строка 1: {line1}")
        print(f"Строка 2: {line2}")
        
        result = tle_to_orbital_elements(line1, line2)
        
        print("\nОрбитальные параметры:")
        print(f"1. Наклонение (i):               {result['inclination_deg']}°")
        print(f"2. Прямое восх. узла (Ω):        {result['raan_deg']}°")
        print(f"3. Эксцентриситет (e):           {result['eccentricity']}")
        print(f"4. Аргумент перигея (ω):         {result['arg_periapsis_deg']}°")
        print(f"5. Средняя аномалия (M):         {result['mean_anomaly_deg']}°")
        print(f"6. Истинная аномалия (ν):        {result['true_anomaly_deg']}°")
        print(f"7. Среднее движение (n):         {result['mean_motion']} оборотов/день")
        print(f"8. Аргумент широты (u):          {result['argument_of_latitude']}°")
        print(f"9. Большая полуось (a):          {result['semimajor_axis_km']} км")
        print(f"10. Высота орбиты:               {result['altitude_km']} км")
        
        print("\nECI координаты (км):")
        print(f"X = {result['eci_position_km'][0]}")
        print(f"Y = {result['eci_position_km'][1]}")
        print(f"Z = {result['eci_position_km'][2]}")

    except requests.exceptions.RequestException as e:
        print(f"Ошибка сети: {str(e)}")
    except ValueError as e:
        print(f"Ошибка данных: {str(e)}")
    except Exception as e:
        print(f"Неожиданная ошибка: {str(e)}")

if __name__ == "__main__":
    main()
